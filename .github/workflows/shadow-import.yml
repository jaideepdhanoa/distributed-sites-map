name: Shadow import

# Manual drift check of the latest published snapshot. Workbook sync skips
# this step when the generated hash matches. This workflow refuses any ref
# other than main. It reports counts and hashed ids and does not write
# workbook rows into the database. Site raw cells need SITE_SHEET_PATH.
# This job does not have that file, so it does not compare those cells.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Report drift against the live snapshot
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_PRODUCTION_HOST: ${{ vars.NEON_PRODUCTION_HOST }}
          READ_STAGES_FROM_DB: ${{ vars.READ_STAGES_FROM_DB }}
          READ_ACTIVITY_FROM_DB: ${{ vars.READ_ACTIVITY_FROM_DB }}
          READ_COMMS_FROM_DB: ${{ vars.READ_COMMS_FROM_DB }}
          READ_SITES_FROM_DB: ${{ vars.READ_SITES_FROM_DB }}
          CHANGES_API_ENABLED: ${{ vars.CHANGES_API_ENABLED || '0' }}
        run: npx tsx scripts/import-shadow.ts
