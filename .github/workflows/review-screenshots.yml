name: Review screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check browser-test secrets
        id: gate
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_USERNAME" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Screenshots skipped. Add secrets E2E_USERNAME and E2E_PASSWORD."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        name: Screenshot the local build
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          node scripts/write-e2e-env.mjs
          npm run build
          npx next start -p 3456 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3456/login && break
            sleep 2
          done
          export E2E_BASE_URL=http://localhost:3456
          npx playwright test e2e/review-shots.spec.ts e2e/map-journey.spec.ts
      - if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        name: Find the Vercel preview for this commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..12}; do
            while read -r id; do
              url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '[.[] | select(.state == "success")][0].environment_url // empty')
              if [[ "$url" =~ ^https://distributed-sites-[a-z0-9]{9}-jaideepdhanoas-projects\.vercel\.app/?$ ]]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$HEAD_SHA" --jq '.[].id')
            sleep 10
          done
          echo "No ready Vercel preview was reported for the pull request commit."
          exit 1
      - if: steps.preview.outputs.url
        name: Walk the deployed preview on desktop and phone
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          MAP_DEPLOYED_PREVIEW: "1"
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test e2e/map-journey.spec.ts
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-screenshots
          path: review-shots/
          if-no-files-found: error
