name: Workbook sync

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt cryptography
      - name: Export the Sheet and rebuild
        id: rebuild
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAP_SYNC_INPUTS_FOLDER_ID: ${{ vars.MAP_SYNC_INPUTS_FOLDER_ID }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.TIMELINE_SITES_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON is not set."
            exit 1
          fi
          python scripts/sync_workbook.py
          python scripts/build_data.py
      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # data/generated includes timeline.json when that build writes it.
          # git diff ignores a brand-new file, so also look for untracked generated files.
          if git diff --quiet -- data/generated data/drift_report.csv data/workbook_stages.json \
            && [ -z "$(git ls-files --others --exclude-standard -- data/generated data/drift_report.csv data/workbook_stages.json)" ]; then
            echo "No data change."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="workbook-sync-$DATE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"
          git add data/generated data/drift_report.csv data/workbook_stages.json
          if [ -f data/generated/timeline.json ]; then
            git add data/generated/timeline.json
          fi
          git commit -m "Workbook sync $DATE"
          TITLE="Workbook sync $DATE"
          python scripts/sync_workbook.py --pr-body /tmp/sync-pr-body.md
          export SYNC_PR_TITLE="$TITLE"
          export SYNC_PR_BODY="$(cat /tmp/sync-pr-body.md)"
          bash scripts/open_sync_pr.sh "$BRANCH"
          python scripts/sync_workbook.py --comment
          gh pr comment "$(cat /tmp/sync-pr-number)" --body-file /tmp/drift-comment.md
      - name: Located deals without a universe row
        if: steps.rebuild.outcome == 'success'
        run: python scripts/build_data.py --gap-gate
