name: Validate data

# Runs on pull requests and on pushes to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_changes.py
      - run: python tests/test_sync_workbook.py
      - run: python tests/test_sync_push.py
      - run: python tests/test_key_numbers.py
      - run: python tests/test_service_area.py
      - run: python tests/test_cstore.py
      - run: python tests/test_business_type.py
      - run: python tests/test_financials.py
      - run: python tests/test_pricing_sources.py
      - run: python tests/test_nda.py
      - run: python tests/test_comms.py
      - run: python tests/test_open_loops.py
      - run: python tests/test_vocabulary.py
      - run: python tests/test_invariants.py
      - run: python scripts/check_surface.py
      - run: python scripts/test_review_fixes.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check_controls.mjs
      - run: node --experimental-strip-types scripts/test-stage-detail.ts
      - run: node --experimental-strip-types scripts/test-drawer-width.ts
      - run: node --experimental-strip-types scripts/test-key-numbers.ts
      - run: node --experimental-strip-types scripts/test-pricing.ts
      - run: node --experimental-strip-types scripts/test-range-strip.ts
      - run: node --experimental-strip-types scripts/test-contacted-deals.ts
      - run: node --experimental-strip-types scripts/test-search.ts
      - run: python scripts/build_data.py --check
      - name: Located deals without a universe row
        if: always()
        run: python scripts/build_data.py --gap-gate

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build the deployment output
        env:
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_EO8tpeZtslyXHrRLvq6IO8rai5bG","orgId":"team_y5zoRoQKTRtBgU8TapkYj9u1","settings":{"framework":"nextjs"}}' > .vercel/project.json
          npx vercel@65.11.0 build --yes
      - run: node scripts/check-function-count.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check browser-test secrets
        id: gate
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_USERNAME" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Browser tests skipped. Add secrets E2E_USERNAME and E2E_PASSWORD."
            echo "To run against a Vercel preview, also set secret VERCEL_AUTOMATION_BYPASS_SECRET and variable E2E_BASE_URL."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'
      - name: Browser checks
        if: steps.gate.outputs.run == 'true'
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            node scripts/write-e2e-env.mjs
            npm run build
            npx next start -p 3456 &
            for i in $(seq 1 40); do
              curl -sf -o /dev/null http://localhost:3456/login && break
              sleep 2
            done
            export E2E_BASE_URL=http://localhost:3456
          fi
          npx playwright test
