name: Workbook sync

# Every 15 minutes. A run takes about 7 minutes. The concurrency group queues
# the next run and does not cancel the one that is already publishing.
# The job does not deploy to Vercel.
#
# GitHub Actions minutes: this repository is public and the job uses
# ubuntu-latest, a standard runner. Standard runners are free and unlimited
# on public repositories, so 96 runs a day are not billed. Do not move this
# job to a larger runner. Those are billed even on public repositories.
#
# Google Drive: the Pipeline workbook is exported once per run
# (files.export, 200 quota units). 96 runs use 19,200 units a day. The
# per-user cap is 325,000 units a minute, and the daily billing threshold
# is 400,000,000 units. The inputs folder can add one export when
# reconciliation is a native Sheet. The hash below is local and does not
# export the Sheet again.
#
# Neon: after the rebuild, hash the generated json, geojson, and csv files.
# The last published hash is kept in the Actions cache (prefix
# workbook-sync-published-), not in Neon and not in a commit. Restoring
# that cache does not open a database connection. A match skips the publish,
# the shadow import, and the cache refresh. GitHub drops a cache that is
# not restored for 7 days. An unchanged sheet restores it every run, so the
# entry stays. If the cache is missing, one read of the live snapshot's
# file hashes runs. A match still skips the write and the refresh, and the
# hash is then saved. The cache is saved after a successful publish, or
# after the live snapshot already matches. That save still runs when a later
# step is cancelled, so a cancelled mirror does not publish the same snapshot
# again. When WORKBOOK_MIRROR_ENABLED is 1, that same run still reads
# Neon and can write the cut-over cells. The mirror is the only workbook
# writer. The drift step does not copy sheet edits into the database.
# The mirror does not publish a snapshot.
#
# Pull requests: when the data checks fail, or the publish did not happen,
# update the open bot sync pull request if every commit on it since main is
# by github-actions[bot]. Do not open a second pull request, and do not
# force-push over anyone else's commits. An unchanged hash does not open a
# pull request. A failed universe-row check updates that same pull request
# and does not open a new one.
#
# Snapshots: 14 rows at a publish every 15 minutes would be about 3.5 hours.
# Unchanged runs no longer publish, so a quiet sheet's 14 rows can span
# days. A snapshot is about 1 MiB. Keeping every changed snapshot from the
# last 24 hours, and at least the last 14, is about 100 MiB if the sheet
# changes on every run. Neon Free allows 1 GB per project, so that day of
# history stays.
on:
  # Backup. Vercel Cron dispatches this workflow every 15 minutes.
  # GitHub may run this schedule later than the mark.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: workbook-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The publish script compares the remote branch with main. A
          # one-commit checkout cannot see that history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt cryptography
      - name: Export the Sheet and rebuild
        id: rebuild
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAP_SYNC_INPUTS_FOLDER_ID: ${{ vars.MAP_SYNC_INPUTS_FOLDER_ID }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.TIMELINE_SITES_FOLDER_ID }}
          SITE_SHEET_PATH: /tmp/site_sheet.json
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON is not set."
            exit 1
          fi
          python scripts/sync_workbook.py
          python scripts/build_data.py
          python -m scripts.selection_inputs
          python -m scripts.opportunity_reviews
          if [ -f data/source/selection-evidence.json ]; then
            cp data/source/selection-evidence.json data/generated/selection-evidence.json
          fi
          if [ -f data/source/space-layouts.json ]; then
            cp data/source/space-layouts.json data/generated/space-layouts.json
          fi
      - name: Hash the generated data
        id: hash
        run: python scripts/snapshot_hash.py > /tmp/snapshot-hash
      - name: Restore the last published hash
        uses: actions/cache/restore@v4
        with:
          path: .workbook-sync-cache/published-hash
          key: workbook-sync-published-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            workbook-sync-published-
      - name: Compare with the last published snapshot
        id: same
        run: |
          current=$(tr -d '[:space:]' < /tmp/snapshot-hash)
          if ! printf '%s' "$current" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "The generated hash is not a sha256." >&2
            exit 1
          fi
          previous=""
          if [ -f .workbook-sync-cache/published-hash ]; then
            previous=$(tr -d '[:space:]' < .workbook-sync-cache/published-hash)
          fi
          if ! printf '%s' "$previous" | grep -Eq '^[0-9a-f]{64}$'; then
            previous=""
          fi
          if [ -n "$previous" ] && [ "$previous" = "$current" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "Generated data matches the last published snapshot. Skipping publish and the shadow import."
            {
              echo "## Snapshot unchanged"
              echo
              echo "The generated data matches the last published snapshot. The snapshot was not published, and the cache was not refreshed."
              echo "The workbook mirror still runs on main when WORKBOOK_MIRROR_ENABLED is 1."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "unchanged=false" >> "$GITHUB_OUTPUT"
          if [ -n "$previous" ]; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "Generated data differs from the last published snapshot."
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
            echo "No published hash is cached."
          fi
      - name: Install test dependencies
        if: steps.same.outputs.unchanged != 'true'
        run: npm ci
      - name: Compare with the live snapshot when no hash is cached
        id: live
        if: steps.same.outputs.unchanged != 'true' && steps.same.outputs.cached != 'true'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "No cached hash, and NEON_DATABASE_URL is not set."
            exit 0
          fi
          npx tsx scripts/snapshot-match.ts
      - name: Data checks
        id: checks
        if: steps.same.outputs.unchanged != 'true' && steps.live.outputs.unchanged != 'true'
        continue-on-error: true
        run: |
          python scripts/run_sync_checks.py /tmp/sync-test-results.md
          node --import tsx scripts/verify-selection-evidence.mjs
          node --import tsx scripts/verify-opportunities.mjs
      - name: Report failed data checks
        if: steps.checks.outcome == 'failure'
        run: |
          {
            echo "## Workbook sync data checks failed"
            echo
            echo "No snapshot was published. The previous live snapshot stays."
            echo
            cat /tmp/sync-test-results.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Data checks failed. No snapshot was published."
      - name: Located deals without a universe row
        id: gap
        if: steps.same.outputs.unchanged != 'true' && steps.live.outputs.unchanged != 'true'
        continue-on-error: true
        run: |
          if ! python scripts/build_data.py --gap-gate > /tmp/gap-gate.txt 2>&1; then
            {
              echo "## Universe-row check failed"
              echo
              echo "No snapshot was published. The previous live snapshot stays."
              echo
              cat /tmp/gap-gate.txt
            } >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/gap-gate.txt
            echo "::error::Universe-row check failed. No snapshot was published."
            exit 1
          fi
          cat /tmp/gap-gate.txt
      - name: Publish the snapshot
        id: publish
        if: steps.same.outputs.unchanged != 'true' && steps.live.outputs.unchanged != 'true' && steps.checks.outcome == 'success' && steps.gap.outcome == 'success'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL is not set. Skipping the database snapshot."
            echo "Add the repository secret NEON_DATABASE_URL: the Neon production pooled connection string."
            echo "Until that secret is set, this job still opens a pull request."
            {
              echo "## Snapshot skipped"
              echo
              echo "NEON_DATABASE_URL is not set, so no snapshot was written."
              echo "Add the repository secret NEON_DATABASE_URL (Neon production pooled connection string)."
              echo "Until then, this job opens a pull request."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx tsx scripts/publish-snapshot.ts
          echo "published=true" >> "$GITHUB_OUTPUT"
          if [ -f "$GITHUB_OUTPUT" ]; then
            id=$(grep '^snapshot_id=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)
            echo "snapshot_id=$id" >> "$GITHUB_OUTPUT"
          fi
      - name: Report workbook drift
        if: steps.publish.outputs.published == 'true' && github.ref == 'refs/heads/main'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_PRODUCTION_HOST: ${{ vars.NEON_PRODUCTION_HOST }}
          SNAPSHOT_ID: ${{ steps.publish.outputs.snapshot_id }}
          # Same repository variables as the mirror step. Actions cannot
          # see the Vercel Production values. This step reports drift and
          # does not apply workbook rows.
          READ_STAGES_FROM_DB: ${{ vars.READ_STAGES_FROM_DB }}
          READ_ACTIVITY_FROM_DB: ${{ vars.READ_ACTIVITY_FROM_DB }}
          READ_COMMS_FROM_DB: ${{ vars.READ_COMMS_FROM_DB }}
          READ_SITES_FROM_DB: ${{ vars.READ_SITES_FROM_DB }}
          CHANGES_API_ENABLED: ${{ vars.CHANGES_API_ENABLED || '0' }}
          SITE_SHEET_PATH: /tmp/site_sheet.json
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npx tsx scripts/import-shadow.ts
      - name: Refresh the production cache
        if: steps.publish.outputs.published == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SNAPSHOT_REVALIDATE_URL: ${{ vars.SNAPSHOT_REVALIDATE_URL }}
        run: npx tsx scripts/revalidate-snapshot.ts
      - name: Mirror database rows into the workbook
        if: github.ref == 'refs/heads/main' && vars.WORKBOOK_MIRROR_ENABLED == '1'
        env:
          WORKBOOK_MIRROR_ENABLED: "1"
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_PRODUCTION_HOST: ${{ vars.NEON_PRODUCTION_HOST }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          READ_STAGES_FROM_DB: ${{ vars.READ_STAGES_FROM_DB }}
          READ_ACTIVITY_FROM_DB: ${{ vars.READ_ACTIVITY_FROM_DB }}
          READ_COMMS_FROM_DB: ${{ vars.READ_COMMS_FROM_DB }}
          READ_SITES_FROM_DB: ${{ vars.READ_SITES_FROM_DB }}
          CHANGES_API_ENABLED: ${{ vars.CHANGES_API_ENABLED || '0' }}
        run: |
          if [ ! -d node_modules/pg ]; then
            npm ci
          fi
          npx tsx scripts/workbook-mirror.ts
      # always() still runs after a cancelled mirror or drift step. The hash
      # file is the snapshot fingerprint. A cancel during publish leaves the
      # output unset, and this step does not save a partial fingerprint.
      - name: Record the published hash
        id: record-hash
        if: always() && (steps.publish.outputs.published == 'true' || steps.live.outputs.unchanged == 'true')
        run: |
          mkdir -p .workbook-sync-cache
          tr -d '[:space:]' < /tmp/snapshot-hash > .workbook-sync-cache/published-hash
          echo >> .workbook-sync-cache/published-hash
      - name: Save the published hash
        if: always() && steps.record-hash.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .workbook-sync-cache/published-hash
          key: workbook-sync-published-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Open or update the sync pull request
        if: steps.same.outputs.unchanged != 'true' && steps.live.outputs.unchanged != 'true' && (steps.checks.outcome == 'failure' || steps.gap.outcome == 'failure' || (steps.checks.outcome == 'success' && steps.gap.outcome == 'success' && (steps.publish.outputs.published != 'true' || vars.WORKBOOK_SYNC_OPEN_PR == 'true')))
        env:
          # Pull requests opened with github.token are authored by
          # github-actions[bot]. On this public repository those pull_request
          # workflows are created and then left at action_required until a
          # maintainer approves them. GITHUB_TOKEN is not allowed to approve
          # its own runs. Set the repository secret SYNC_GITHUB_TOKEN to a
          # fine-grained personal access token owned by a collaborator with
          # write access (Jaideep). Repository: jaideepdhanoa/distributed-sites-map
          # only. Permissions: Contents read and write, Pull requests read and
          # write. The pull request is then opened as that user and Validate
          # data, Actions, Timeline, and Review screenshots start on their own.
          # Do not print the token. A GitHub App installed on this repository
          # with the same two permissions is the same fix if a token that
          # expires is a problem; mint an installation token in this step and
          # pass it as GH_TOKEN.
          GH_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN || github.token }}
          SYNC_DISCOVER_PR: "1"
          SYNC_UPDATE_ONLY: ${{ (steps.checks.outcome == 'failure' || steps.gap.outcome == 'failure') && '1' || '' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="workbook-sync-$DATE"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"
          git add data/generated data/drift_report.csv data/workbook_stages.json
          if [ -f data/generated/timeline.json ]; then
            git add data/generated/timeline.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit. No pull request."
            exit 0
          fi
          git commit -m "Workbook sync $DATE"
          TITLE="Workbook sync $DATE"
          python scripts/sync_workbook.py --pr-body /tmp/sync-pr-body.md
          if [ -f /tmp/sync-test-results.md ]; then
            printf '\n%s\n' "$(cat /tmp/sync-test-results.md)" >> /tmp/sync-pr-body.md
          fi
          export SYNC_PR_TITLE="$TITLE"
          export SYNC_PR_BODY="$(cat /tmp/sync-pr-body.md)"
          bash scripts/open_sync_pr.sh "$BRANCH"
          if [ ! -s /tmp/sync-pr-number ]; then
            echo "No sync pull request to comment on."
            exit 0
          fi
          BRANCH="$(cat /tmp/sync-branch)"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"
          python scripts/sync_workbook.py --comment
          gh pr comment "$(cat /tmp/sync-pr-number)" --body-file /tmp/drift-comment.md
      - name: Start the checks the bot pull request cannot start itself
        if: steps.same.outputs.unchanged != 'true' && steps.live.outputs.unchanged != 'true' && steps.checks.outcome == 'success' && steps.gap.outcome == 'success' && (steps.publish.outputs.published != 'true' || vars.WORKBOOK_SYNC_OPEN_PR == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN_IS_DEFAULT: ${{ secrets.SYNC_GITHUB_TOKEN == '' && 'true' || 'false' }}
        run: |
          if [ "$SYNC_TOKEN_IS_DEFAULT" != "true" ]; then
            echo "SYNC_GITHUB_TOKEN is set. pull_request workflows start on their own."
            exit 0
          fi
          if [ ! -s /tmp/sync-branch ]; then
            echo "No sync branch to dispatch."
            exit 0
          fi
          # workflow_dispatch is the one event GITHUB_TOKEN is allowed to
          # create. The runs use the sync branch and show on its head commit.
          # The pull_request copies stay at action_required until the secret
          # above is set. A dispatch failure does not hide the data pull request.
          BRANCH="$(cat /tmp/sync-branch)"
          for workflow in validate-data.yml actions.yml timeline.yml review-screenshots.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "Dispatched $workflow on $BRANCH."
            else
              echo "Could not dispatch $workflow on $BRANCH."
            fi
          done
      - name: Check whether these financial inputs passed signed-in production readback
        id: purchase-readback
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && hashFiles('data/generated/purchase-review.json') != '' && (steps.publish.outputs.published == 'true' || steps.same.outputs.unchanged == 'true' || steps.live.outputs.unchanged == 'true')
        uses: actions/cache@v4
        with:
          path: .purchase-review-readback
          key: purchase-review-readback-v1-${{ hashFiles('data/generated/purchase-review.json') }}
      - name: Verify the released financial inputs and assumptions
        if: always() && !cancelled() && steps.purchase-readback.outcome == 'success' && steps.purchase-readback.outputs.cache-hit != 'true'
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node scripts/verify-purchase-review.mjs
      - name: Check whether this layout file has passed signed-in production readback
        id: layouts
        if: github.ref == 'refs/heads/main' && hashFiles('data/generated/space-layouts.json') != '' && (steps.publish.outputs.published == 'true' || steps.same.outputs.unchanged == 'true' || steps.live.outputs.unchanged == 'true')
        uses: actions/cache@v4
        with:
          path: .space-layouts-readback
          key: space-layout-readback-v1-${{ hashFiles('data/generated/space-layouts.json') }}
      - name: Verify each released layout and source aerial
        if: steps.layouts.outcome == 'success' && steps.layouts.outputs.cache-hit != 'true'
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node scripts/verify-space-layouts.mjs
      - name: Check whether the offering research passed signed-in readback
        id: research-readback
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && hashFiles('data/generated/selection-evidence.json') != '' && (steps.publish.outputs.published == 'true' || steps.same.outputs.unchanged == 'true' || steps.live.outputs.unchanged == 'true')
        uses: actions/cache@v4
        with:
          path: .selection-readback
          key: selection-readback-v1-${{ hashFiles('data/generated/selection-evidence.json') }}
      - name: Verify the released offering research
        if: always() && !cancelled() && steps.research-readback.outcome == 'success' && steps.research-readback.outputs.cache-hit != 'true'
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ ! -d node_modules/tsx ]; then npm ci; fi
          node --import tsx scripts/verify-selection-evidence.mjs --live
      - name: Verify published opportunity reviews
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && hashFiles('data/generated/opportunity-reviews.json') != '' && (steps.publish.outputs.published == 'true' || steps.same.outputs.unchanged == 'true' || steps.live.outputs.unchanged == 'true')
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ ! -d node_modules/tsx ]; then npm ci; fi
          node --import tsx scripts/verify-opportunities.mjs --live
      - name: Fail when the data checks failed
        if: steps.checks.outcome == 'failure' || steps.gap.outcome == 'failure'
        run: exit 1
