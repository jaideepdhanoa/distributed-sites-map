name: Review screenshots

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - components/Explorer.tsx
      - components/MapView.tsx
      - components/MapSitePreview.tsx
      - lib/mutedStyle.ts
      - e2e/map-journey.spec.ts
      - e2e/layout-options.spec.ts
      - e2e/purchase-review.spec.ts
      - e2e/charging-parity.spec.ts
      - lib/charging/**
      - components/ChargingEconomics.tsx
      - e2e/selection-review.spec.ts
      - app/selection-review/**
      - lib/selection/**
      - lib/api/handlers/data/selection-review.ts
      - scripts/selection_inputs.py
      - components/spaces/**
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      HAS_PREVIEW_ACCESS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check browser-test secrets
        id: gate
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_USERNAME" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Screenshots skipped. Add secrets E2E_USERNAME and E2E_PASSWORD."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        name: Screenshot the local build
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          node scripts/write-e2e-env.mjs
          npm run build
          npx next start -p 3456 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3456/login && break
            sleep 2
          done
          export E2E_BASE_URL=http://localhost:3456
          npx playwright test e2e/review-shots.spec.ts e2e/map-journey.spec.ts e2e/layout-options.spec.ts e2e/selection-review.spec.ts e2e/purchase-review.spec.ts e2e/charging-parity.spec.ts e2e/acquisition-navigation.spec.ts
      - if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.HAS_PREVIEW_ACCESS == 'true'
        name: Find the Vercel preview for this commit
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in {1..6}; do
            comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "vercel[bot]") | .body')
            if [[ "$comment" =~ (https://distributed-sites-map-git-[a-z0-9-]+-jaideepdhanoas-projects\.vercel\.app)[/\?\)[:space:]] ]]; then
              echo "url=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Vercel has not posted a preview for this pull request."
          exit 1
      - if: steps.preview.outputs.url
        name: Walk the deployed preview on desktop and phone
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          MAP_DEPLOYED_PREVIEW: "1"
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test e2e/map-journey.spec.ts e2e/layout-options.spec.ts e2e/selection-review.spec.ts e2e/purchase-review.spec.ts e2e/charging-parity.spec.ts e2e/acquisition-navigation.spec.ts
      - if: steps.gate.outputs.run == 'true' && github.event_name == 'push'
        name: Walk the released map on desktop and phone
        env:
          E2E_BASE_URL: https://distributedsites.com
          E2E_EXPECTED_SHA: ${{ github.sha }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          MAP_PRODUCTION_CHECK: "1"
        run: |
          for attempt in {1..30}; do
            if curl -fsS "$E2E_BASE_URL/login" | grep -F "name=\"build-sha\" content=\"$E2E_EXPECTED_SHA\"" > /dev/null; then break; fi
            sleep 10
          done
          npx playwright test e2e/map-journey.spec.ts
          npx playwright test e2e/layout-options.spec.ts --grep "open a released outline"
          npx playwright test e2e/selection-review.spec.ts --grep "released selection"
          npx playwright test e2e/purchase-review.spec.ts --grep "open released financials"
          npx playwright test e2e/charging-parity.spec.ts --grep "open released charging"
      - if: steps.gate.outputs.run == 'true' && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: review-screenshots
          path: review-shots/
          if-no-files-found: error
