name: Actions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Site read type parity
        run: npx tsx scripts/parity-site-types.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:actions
      - uses: actions/upload-artifact@v4
        with:
          name: assignment-handoff
          path: review-shots/*-work-handoff.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: review-change-screenshots
          path: |
            review-shots/*-comparison-coverage.png
            review-shots/*-review-change.png
            review-shots/*-finding-*.png
            review-shots/*-comparison-request.png
            review-shots/*-comparison-decision.png
            review-shots/*-decision-to-revisit.png
            review-shots/*-decision-queue.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-empty-state
          path: review-shots/*-empty-my-work.png
          if-no-files-found: error
