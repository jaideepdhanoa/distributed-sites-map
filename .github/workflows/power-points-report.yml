name: Power points report

# Manual read. Prints rating counts for in-play rows. It does not write
# the workbook or the database. CI logs are counts only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dry-run power points report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npx tsx scripts/power-points-report.ts
