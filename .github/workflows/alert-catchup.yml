name: Alert catch-up

# One email, sent by hand from main. Dry run is the default and prints counts only.
# The message is not written to the job log.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print counts only. Set false to send the one catch-up email."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  catch-up:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Compose the catch-up
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_EMAIL_DOMAIN: ${{ vars.RESEND_EMAIL_DOMAIN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npx tsx scripts/alert-catchup.ts
